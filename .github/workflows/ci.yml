name: IdeaServer DEV CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: find . -path './node_modules' -prune -o -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
